name: Build and deploy public workshop site

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: public-pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10.14.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm validate
      - name: Build public site
        run: pnpm build
        env:
          GITHUB_PAGES_BASE: /${{ github.event.repository.name }}/
          WORKSHOP_ENVIRONMENT: production
      - name: Publish release provenance
        shell: bash
        run: |
          set -euo pipefail
          # Served so private verification can prove the live site is this release rather than
          # inferring it from route smoke tests, which look identical across releases.
          if [ -f release-provenance.json ]; then
            cp release-provenance.json dist/release-provenance.json
          else
            echo "No release-provenance.json in the public source tree." >&2
            exit 1
          fi
      - name: Upload Pages artifact
        if: github.event_name == 'push'
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - name: Upload pull request review artifact
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: public-slide-review-${{ github.event.pull_request.number }}
          path: dist
          retention-days: 7

  deploy:
    if: github.event_name == 'push'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Verify deployed routes
        shell: bash
        run: |
          set -euo pipefail
          base="${{ steps.deployment.outputs.page_url }}"
          base="${base%/}/"
          curl --fail --retry 5 --retry-delay 5 "${base}site-routes.json" --output site-routes.json
          jq -e '.routes | length > 0' site-routes.json > /dev/null
          jq -r '.routes[]' site-routes.json | while IFS= read -r route; do
            curl --fail --retry 5 --retry-delay 5 "${base}${route}" > /dev/null
          done
